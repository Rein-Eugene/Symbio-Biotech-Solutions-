made sacks on the same footprint — which suits ${b.landDesc.toLowerCase()}. With ${b.waterDesc} water and drip or top-feeding, first harvest is still around 30 days.`,watch:"Higher upfront cost per bag than homemade sacks — worth it once you are running enough bags that consistent yield and durability start to matter."},{id:"kienyeji-greens",category:"crops",name:"Kienyeji leafy vegetables (Managu, Terere, Saget)",accent:"#6B8E4E",minCapital:5e3,costHigh:15e3,landMin:1,waterMin:1,labourMin:0,paybackMin:1,paybackMax:1.5,risk:"Low",fastCycle:!0,unitLabel:"kg of greens",season:"Best sown at the start of the long rains (Mar–Apr) or short rains (Oct–Nov) for natural moisture; irrigate to plant in other months.",fit:b=>`Traditional greens like managu, mrenda and saga grow well in open ground on ${b.landDesc.toLowerCase()}, are naturally hardy on ${b.waterDesc} water, and have strong steady local demand. First cutting is usually within 3–5 weeks, with repeat harvests after.`,watch:"Prices swing with local supply — worth confirming buyers and price before scaling up the plot."},{id:"tomato-openfield",category:"crops",name:"Open field tomato farming",accent:"#B5622E",minCapital:25e3,costHigh:7e4,landMin:2,waterMin:2,labourMin:1,paybackMin:3,paybackMax:4,risk:"High",fastCycle:!1,unitLabel:"kg of tomatoes",season:"Transplant at the start of the long rains (Mar–Apr) or short rains (Oct–Nov) so harvest lands as the rains ease, lowering blight pressure.",fit:b=>`Tomatoes need real space and consistent watering to pay off, which fits ${b.landDesc.toLowerCase()} with ${b.waterDesc} water. First harvest is around 3 months, then continues for several weeks — but this is a higher-stakes venture than the others here.`,watch:"Blight and pest pressure are serious and fast-moving, and tomato prices can crash at peak harvest season — spray schedule and market timing both need to be planned before planting."},{id:"seedling-nursery",category:"crops",name:"Vegetable seedling nursery",accent:"#6B8E4E",minCapital:8e3,costHigh:25e3,landMin:1,waterMin:1,labourMin:0,paybackMin:1,paybackMax:1.5,risk:"Medium",fastCycle:!0,unitLabel:"trays of seedlings",season:"Sow 4–6 weeks ahead of the rains — Jan–Feb for the long rains, Aug–Sep for the short rains — so seedlings are ready right when farmers want to transplant.",fit:b=>`Raising seedlings (kale, tomato, onion) for sale to other farmers turns over fast — trays are ready to sell around 3–4 weeks. With ${b.marketDesc} you have a route to move them quickly before they are overgrown.`,watch:"Timing matters — seedlings held too long lose value fast, so buyers need to be lined up before you sow."},{id:"ofsp",category:"crops",name:"Orange-fleshed sweet potatoes (OFSP)",accent:"#D4A73B",minCapital:6e3,costHigh:18e3,landMin:1,waterMin:0,labourMin:0,paybackMin:3,paybackMax:4,risk:"Low",fastCycle:!1,unitLabel:"kg of sweet potato",season:"Plant vine cuttings at the start of either rain season (Mar–Apr or Oct–Nov) — early moisture gets roots established fastest.",fit:b=>`OFSP vines are drought-tolerant and low-maintenance, doing fine even with ${b.waterDesc} water on ${b.landDesc.toLowerCase()}, and mature in about 3–4 months. The vines themselves can also be sold or fed to livestock, giving a second income stream from the same planting.`,watch:"Start with clean, disease-free vine cuttings from a reputable source — planting material carrying weevil damage or virus undermines the whole plot from day one."},{id:"greenhouse-tomato-capsicum",category:"crops",name:"Greenhouse tomato & capsicum",accent:"#B5622E",minCapital:18e4,costHigh:35e4,landMin:2,waterMin:2,labourMin:1,paybackMin:4,paybackMax:6,risk:"Medium",fastCycle:!1,unitLabel:"kg of tomatoes/capsicum",season:"A greenhouse buffers against rain-driven disease, so planting isn’t tied to the rains — time transplants so harvest lands when open-field supply (and prices) typically dip.",fit:b=>`A greenhouse gives tomatoes and capsicums real protection from blight and unpredictable rain, which is what makes open-field tomato risky — a bigger investment but a steadier crop. Needs ${b.landDesc.toLowerCase()} for the structure and ${b.waterDesc} water for a drip system.`,watch:"The structure itself is the major upfront cost — this only pays off with disciplined, season-round management to keep beds continuously productive."},{id:"fodder",category:"crops",name:"Fodder grass production (Brachiaria, Sudan grass, Lucerne)",accent:"#6B8E4E",minCapital:15e3,costHigh:4e4,landMin:2,waterMin:1,labourMin:0,paybackMin:4,paybackMax:8,risk:"Low",fastCycle:!1,unitLabel:"bales/bags of fodder",season:"Establish at the start of the long rains (Mar–Apr) so the grass roots in well before the dry season tests it.",fit:b=>`Once Brachiaria or Sudan grass is established on ${b.landDesc.toLowerCase()}, it needs very little daily attention — a good match if you have land sitting idle but not much spare time, since ${b.labourDesc} is enough to maintain it. You sell to livestock and dairy keepers rather than end consumers.`,watch:"Takes several months to establish before the first cut, and the market depends on nearby livestock keepers actually needing fodder — worth confirming buyers before planting a large area."},{id:"soil-legumes",category:"crops",name:"Soil-improving legumes (Velvet bean, Lucerne, Sunn hemp)",accent:"#6B8E4E",minCapital:8e3,costHigh:25e3,landMin:1,waterMin:0,labourMin:0,paybackMin:3,paybackMax:4,risk:"Low",fastCycle:!1,unitLabel:"kg of seed / bales of green manure",season:"Sow at the start of the long rains (Mar–Apr) so the cover crop establishes and can be incorporated before the next planting cycle.",fit:b=>`Velvet bean, Lucerne and sunn hemp fix nitrogen and rebuild soil structure, sold either as seed to other farmers or as green manure — a growing market as more farmers move toward regenerative practices. Works well on ${b.landDesc.toLowerCase()} with ${b.waterDesc} water. Cuttings that aren't sold as green manure feed straight into a composting line, so nothing here needs to go to waste.`,watch:"Awareness of cover cropping is still building in most areas — pairing sales with a short explanation of the soil benefit helps close sales faster than the product alone."},{id:"flower-seedlings",category:"crops",name:"Flower seedling nursery (Starke Ayres varieties)",accent:"#6B4A2E",minCapital:12e3,costHigh:35e3,landMin:1,waterMin:1,labourMin:0,paybackMin:2,paybackMax:4,risk:"Medium",fastCycle:!1,unitLabel:"trays/pots of seedlings",season:"Perennials can be started any time; annual bedding varieties do best sown a few weeks ahead of the rains.",fit:b=>`Raising selected annual and perennial flower varieties for sale as seedlings feeds landscaping, hospitality, and gardening markets — strongest where you're near an urban, peri-urban, or tourism-adjacent buyer base rather than a purely rural one. ${b.landDesc.charAt(0).toUpperCase()+b.landDesc.slice(1)} with ${b.waterDesc} water covers a working nursery bed.`,watch:"Demand depends heavily on reaching the right buyers (nurseries, landscapers, hotels, garden centres) — confirm a market route before investing."},{id:"greenhouse-strawberry",category:"crops",name:"Greenhouse strawberry (vertical system)",accent:"#A1462F",minCapital:2e5,costHigh:4e5,landMin:2,waterMin:2,labourMin:1,paybackMin:6,paybackMax:9,risk:"Medium",fastCycle:!1,unitLabel:"kg of strawberries",season:"Best started in a cooler highland zone; in warmer areas, plan for shade netting before planting rather than after yields disappoint.",fit:b=>`A vertical multistorey system in its own dedicated greenhouse (separate from a tomato/capsicum house) maximizes plants per square metre and keeps fruit clean and easy to pick. ${b.climate==="highland"?"Your highland conditions are a genuinely good match for this.":b.climate==="lowland"?"In lowland, hot conditions this needs shade netting and extra cooling to get good yields — factor that into the budget up front.":"This performs best in cooler highland zones (like Kiambu or Nyeri) — in warmer mid-altitude or lowland areas, shade netting and extra cooling help protect yields."} Needs ${b.landDesc.toLowerCase()} for the structure and ${b.waterDesc} water for drip/misting.`,watch:"Climate match matters more here than for most ventures in this list — confirm your altitude and typical daytime temperatures suit strawberries before committing this level of capital."},{id:"herbs-spices",category:"crops",name:"Herbs & spices production (hospitality supply)",accent:"#6B8E4E",minCapital:1e4,costHigh:3e4,landMin:1,waterMin:1,labourMin:0,paybackMin:2,paybackMax:3,risk:"Medium",fastCycle:!1,unitLabel:"kg of herbs",season:"Not season-dependent if irrigated — most varieties (basil, coriander, rosemary) can be sown or transplanted any time with reliable water.",fit:b=>`A mixed bed of basil, coriander, rosemary and similar herbs supplies restaurants and hotels wanting fresh, consistent volumes — a market that's strongest near urban centres, tourism hubs, or export packers rather than purely rural areas. ${b.marketDesc.charAt(0).toUpperCase()+b.marketDesc.slice(1)} is the main factor in whether this pencils out.`,watch:"Hospitality buyers want consistent quality and volume on a schedule — this rewards a steady supply relationship with a few buyers over scattered one-off sales."},{id:"yellow-beans",category:"crops",name:"Yellow beans farming",accent:"#D4A73B",minCapital:8e3,costHigh:25e3,landMin:1,waterMin:1,labourMin:0,paybackMin:3,paybackMax:3,risk:"Low",fastCycle:!1,unitLabel:"kg of yellow beans",season:"Sow at the start of the long rains (Mar–Apr) or short rains (Oct–Nov); beans mature in about 3 months.",fit:b=>`Yellow beans are a reliable, high-demand staple with a shorter cycle than most grain legumes, doing well on ${b.landDesc.toLowerCase()} with ${b.waterDesc} water. As a legume, the crop also leaves the soil richer in nitrogen for whatever you plant next.`,watch:"Prices shift with the wider bean market — worth checking current local buying prices before committing a large plot."},{id:"garlic",category:"crops",name:"Garlic farming",accent:"#9B8B5C",minCapital:15e3,costHigh:4e4,landMin:1,waterMin:1,labourMin:0,paybackMin:4,paybackMax:5,risk:"Medium",fastCycle:!1,unitLabel:"kg of garlic",season:"Time planting so the crop matures before the heaviest rains — garlic bulbs are prone to rot in waterlogged soil.",fit:b=>`Garlic commands a strong price relative to its input cost and stores well after harvest, so you're not forced to sell immediately. It needs well-drained soil rather than waterlogging, so ${b.landDesc.toLowerCase()} with ${b.waterDesc} water works as long as drainage is good.`,watch:"Bulb rot from overwatering or poor drainage is the main risk — raised beds or well-drained plots matter more here than for most vegetables."},{id:"onion",category:"crops",name:"Onion farming",accent:"#B08D57",minCapital:12e3,costHigh:35e3,landMin:1,waterMin:1,labourMin:0,paybackMin:3,paybackMax:4,risk:"Medium",fastCycle:!1,unitLabel:"kg of onions",season:"Sow nursery beds 6–8 weeks before transplanting; time transplanting so bulbing happens as the rains ease, since onions prefer drier conditions near maturity.",fit:b=>`Onions are a steady, always-in-demand crop, and like garlic they store well after harvest so you're not forced to sell at harvest-time prices. ${b.landDesc.charAt(0).toUpperCase()+b.landDesc.slice(1)} with ${b.waterDesc} water suits a nursery-then-transplant system.`,watch:"Thrips and downy mildew are the main pest/disease risks — a spray schedule during growth protects the bulb size and quality that determine your price."},{id:"oyster-mushroom",category:"crops",name:"Oyster mushroom farming",accent:"#A9A18C",minCapital:1e4,costHigh:3e4,landMin:0,waterMin:1,labourMin:0,paybackMin:1,paybackMax:1.5,risk:"Medium",fastCycle:!0,unitLabel:"kg of mushrooms",season:"Not season-dependent — grown in shaded substrate bags indoors, so timing is about substrate and humidity, not rainfall.",fit:b=>`Oyster mushrooms grow on agricultural waste (straw, maize cobs, sawdust) packed into shaded substrate bags, so ${b.landDesc.toLowerCase()} is enough. Spent substrate afterward becomes excellent compost feedstock, so this fits neatly alongside your composting work rather than sitting apart from it. First flush is ready in as little as 3–4 weeks.`,watch:"Needs a clean, humid, shaded growing space — contamination from mould or bacteria in the substrate is the main risk."},{id:"poultry-broilers",category:"livestock",name:"Poultry — broilers",accent:"#D4A73B",minCapital:15e3,costHigh:4e4,landMin:1,waterMin:2,labourMin:0,paybackMin:2,paybackMax:3,risk:"Medium",fastCycle:!1,unitLabel:"birds sold",season:"Not season-dependent — but consider timing a batch to finish before high-demand periods like the December festive season.",fit:b=>`Broilers reach market weight in about 6–8 weeks, giving a faster cycle than most livestock. Reliable water is essential for growth rate, and ${b.labourDesc} is enough to manage a starter flock.`,watch:"Disease (especially Newcastle and coccidiosis) is the biggest risk — biosecurity and vaccination schedule are non-negotiable."},{id:"poultry-layers",category:"livestock",name:"Poultry — layers (eggs)",accent:"#D4A73B",minCapital:3e4,costHigh:7e4,landMin:1,waterMin:2,labourMin:0,paybackMin:4,paybackMax:6,risk:"Medium",fastCycle:!1,unitLabel:"trays of eggs (30 eggs)",season:"Not season-dependent — point-of-lay birds start producing about 4–6 months after start regardless of when you begin.",fit:b=>`Layers start producing at around 18–20 weeks, then give steady daily income from egg sales rather than one lump sum. That suits ${b.marketDesc} where you can sell small quantities regularly.`,watch:"Requires consistent feed quality — a dip in feed protein shows up directly as fewer eggs within days."},{id:"goats",category:"livestock",name:"Goat rearing / breeding",accent:"#B5622E",minCapital:4e4,costHigh:1e5,landMin:2,waterMin:1,labourMin:0,paybackMin:6,paybackMax:12,risk:"Medium",fastCycle:!1,unitLabel:"goats sold",season:"Breeding can start any time, but kidding tends to go easier if timed so kids arrive during or just after the rains, when browse is most plentiful.",fit:b=>`Goats are hardy on ${b.waterDesc} water and do well on browse rather than pasture, so ${b.landDesc.toLowerCase()} can still support a small herd. Kidding cycles mean income builds over 6–12 months rather than immediately.`,watch:"Grazing/browse space and predator-proof housing at night are essential — losses from theft or disease hit hardest at this scale."},{id:"pigs",category:"livestock",name:"Pig farming (meat finishing)",accent:"#A8735A",minCapital:5e4,costHigh:12e4,landMin:1,waterMin:2,labourMin:1,paybackMin:4,paybackMax:6,risk:"Medium",fastCycle:!1,unitLabel:"pigs sold",season:"Not season-dependent — reliable water access matters far more than time of year.",fit:b=>`Pigs finish for market in around 5–6 months and don't need open grazing, just a well-built sty — workable within ${b.landDesc.toLowerCase()}. Reliable water is critical daily, which matches what you have.`,watch:"Feed is the largest recurring cost and can erode margins fast if not sourced carefully; reliable water access is non-negotiable."},{id:"piglet-breeding",category:"livestock",name:"Piglet breeding (starting with in-pig sows)",accent:"#A8735A",minCapital:6e4,costHigh:14e4,landMin:1,waterMin:2,labourMin:1,paybackMin:3,paybackMax:4,risk:"Medium",fastCycle:!1,unitLabel:"piglets sold",season:"Not season-dependent — reliable water and a warm, draft-free farrowing space matter more than time of year.",fit:b=>`Starting with sows already in-pig skips the breeding wait — you're selling piglets from your first litter within a few months rather than starting the whole cycle from scratch. ${b.labourDesc.charAt(0).toUpperCase()+b.labourDesc.slice(1)} covers daily feeding and farrowing supervision, and there's steady demand from farmers wanting to start or restock a pig enterprise.`,watch:"Farrowing needs close attention for the first few days — losing piglets at birth is the biggest risk to the return on an already-expensive breeding sow."},{id:"rabbits",category:"livestock",name:"Rabbit farming",accent:"#A8735A",minCapital:15e3,costHigh:4e4,landMin:0,waterMin:1,labourMin:0,paybackMin:3,paybackMax:4,risk:"Medium",fastCycle:!1,unitLabel:"rabbits sold",season:"Not season-dependent — breeding cycles run year-round regardless of when you start.",fit:b=>`Rabbits are raised in hutches, so ${b.landDesc.toLowerCase()} is enough space, and breeding cycles are short — does can rebreed within weeks of kindling. ${b.labourDesc.charAt(0).toUpperCase()+b.labourDesc.slice(1)} covers daily feeding and hutch cleaning. Demand is strongest in and around urban and peri-urban areas.`,watch:"Rural markets for rabbit meat can be thin — this does best where you can reach an urban or peri-urban buyer base."},{id:"apiculture",category:"livestock",name:"Apiculture (beekeeping)",accent:"#D4A73B",minCapital:6e4,costHigh:15e4,landMin:1,waterMin:0,labourMin:0,paybackMin:6,paybackMax:12,risk:"Low",fastCycle:!1,unitLabel:"kg of honey",season:"Place hives just before local flowering season begins so bees are established in time for the main nectar flow.",fit:b=>`Hives need very little daily labour once established, which fits ${b.labourDesc}. Honey, wax and propolis all sell, spreading risk across products — but it takes a full season before the first real harvest.`,watch:"Needs flowering vegetation nearby for forage, and upfront hive cost is the main barrier — returns are real but not immediate."},{id:"passion-fruit",category:"trees",name:"Passion fruit farming",accent:"#6B4A2E",minCapital:2e4,costHigh:5e4,landMin:2,waterMin:1,labourMin:0,paybackMin:8,paybackMax:12,risk:"Medium",fastCycle:!1,unitLabel:"kg of passion fruit",season:"Plant at the start of the long rains (Mar–Apr) so the vine establishes before facing its first dry season.",fit:b=>`Passion fruit vines need a trellis and room to spread, which fits ${b.landDesc.toLowerCase()}, and once established they handle ${b.waterDesc} water reasonably well. It's a longer wait — first real harvest is usually 8–12 months out — but a single planting then keeps producing for several years.`,watch:"Fusarium wilt and viral disease can wipe out a planting fast if grafted, disease-resistant seedlings aren’t used from the start."},{id:"pixie-orange",category:"trees",name:"Pixie orange farming",accent:"#D4A73B",minCapital:3e4,costHigh:8e4,landMin:2,waterMin:1,labourMin:0,paybackMin:18,paybackMax:30,risk:"Medium",fastCycle:!1,unitLabel:"kg of pixie oranges",season:"Plant grafted seedlings at the start of the long rains (Mar–Apr) so young trees establish before the first dry season.",fit:b=>`Pixie oranges are a high-value, increasingly sought-after citrus variety in Kenya right now, and once mature the trees keep producing for many years from the same planting on ${b.landDesc.toLowerCase()}. This is a genuinely long game — first meaningful harvest is typically 18–30 months out — but it builds a durable, low-maintenance income once established.`,watch:"Use grafted, disease-resistant seedlings from a reputable nursery — citrus greening and other diseases can undermine years of growth."},{id:"tree-nursery",category:"trees",name:"Tree nursery (seedling production)",accent:"#6B8E4E",minCapital:1e4,costHigh:3e4,landMin:1,waterMin:1,labourMin:0,paybackMin:4,paybackMax:8,risk:"Low",fastCycle:!1,unitLabel:"seedlings sold",season:"Sow 3–6 months ahead of the rains (species-dependent) so seedlings are ready for the main planting windows (Mar–Apr and Oct–Nov).",fit:b=>`A tree nursery raising timber, agroforestry, or fruit seedlings feeds steady demand from other farmers planting ahead of the rains. Grafted fruit tree seedlings — mango, avocado, citrus — are worth considering as a focus. ${b.landDesc.charAt(0).toUpperCase()+b.landDesc.slice(1)} with ${b.waterDesc} water is enough to run a productive nursery bed.`,watch:"Demand is highly seasonal, spiking just before the rains — timing your sowing to have stock ready then matters most."},{id:"compost-faa-jms",category:"compost",name:"Compost production (FAA & JMS enriched)",accent:"#6B8E4E",minCapital:2e4,costHigh:6e4,landMin:1,waterMin:1,labourMin:1,paybackMin:2,paybackMax:3,risk:"Low",fastCycle:!1,unitLabel:"50kg bags of compost",season:"Not season-dependent — raw material (crop residue, manure) supply is steadiest right after harvest seasons (Jul–Aug and Dec–Jan).",fit:b=>`Using FAA and JMS microbial inputs to speed decomposition, plus activated biochar for extra nutrient retention, gives a faster, richer compost than plain heap composting — sellable to other farmers as a packaged product. ${b.landDesc.charAt(0).toUpperCase()+b.landDesc.slice(1)} gives you a composting yard, and ${b.waterDesc} water keeps the pile active.`,watch:"Consistent input supply (manure, crop residue, biochar) and correct FAA/JMS timing are what separate a fast, sellable compost from a slow, mediocre one."},{id:"vermicomposting",category:"compost",name:"Vermicomposting (worms & vermicompost)",accent:"#6B8E4E",minCapital:15e3,costHigh:4e4,landMin:0,waterMin:1,labourMin:0,paybackMin:2,paybackMax:3,risk:"Low",fastCycle:!1,unitLabel:'kg of vermicompost ("black gold")',season:"Not season-dependent — worm beds need shade and steady moisture year-round rather than a planting window.",fit:b=>`Worm bins turn organic waste into "black gold" vermicompost, and once the worm population multiplies, surplus worms themselves become a second product to sell. A realistic early target is around 50kg of compost a week once beds are established. Fits ${b.landDesc.toLowerCase()} since bins take very little space.`,watch:"Worms are sensitive to heat, dryness and over-acidic feedstock — steady moisture and feeding management matter more here."}],Of=[{id:"compost-loop",title:"Soil-to-Sale Compost Loop",ventureIds:["soil-legumes","compost-faa-jms"],narrative:"Grow velvet bean or sunn hemp as a soil-improving legume, cut at flowering for maximum nitrogen, and feed the cuttings into your FAA/JMS compost line with activated biochar. Sell the finished compost as a nutrient-rich packaged product, and keep some back to improve your own plots for free.",benefits:"Two sellable outputs (legume seed or green manure, plus compost) from a shared land and labour cycle, and lower input cost for the compost line since part of the feedstock is grown, not bought."},{id:"rabbit-compost-veg-loop",title:"Rabbit–Compost–Vegetable Loop",ventureIds:["rabbits","compost-faa-jms","tomato-sacks"],narrative:"Rabbit urine and manure go straight into FAA/JMS composting, producing a fast, nutrient-dense compost. That compost feeds tomato sacks (or IPM grow bags), giving a fast-cycle vegetable harvest grown largely from your own inputs rather than bought fertilizer.",benefits:"Three sellable products (rabbits, compost, vegetables) from one connected system, lower input costs on the vegetable side, and a built-in, productive use for rabbit waste."},{id:"poultry-compost-fodder-loop",title:"Poultry–Compost–Fodder Loop",ventureIds:["poultry-layers","compost-faa-jms","fodder"],narrative:"Poultry droppings are composted with FAA/JMS, then used to boost a fodder grass plot. The fodder sells to nearby livestock keepers, or feeds your own goats or pigs if you run them, closing a feed-and-fertility loop.",benefits:"Turns a waste product (droppings) into two extra income lines, and cuts external fertilizer cost on the fodder plot."},{id:"apiary-orchard-loop",title:"Apiary–Orchard Loop",ventureIds:["apiculture","passion-fruit","pixie-orange"],narrative:"Beehives placed near passion fruit or pixie orange plantings improve pollination and fruit set, while the orchard blossoms feed the bees in turn. Two biologically reinforcing income streams share the same plot rather than competing for it.",benefits:"Better fruit yield from improved pollination, plus honey and wax income, without needing separate land for the apiary."}],Bf={all:"All enterprises",crops:"Crops & Vegetables",livestock:"Livestock & Breeding",trees:"Trees & Perennials",compost:"Compost & Value-Add"},_f=["sack or container space only","a small plot (up to 1/8 acre)","a medium plot (1/8 to 1 acre)","1 to 5 acres","5 acres or more"],K3=["none / rain-dependent only","seasonal (borehole, seasonal stream)","reliable year-round"],Z3=["working it yourself part-time","working it yourself full-time","family / household help","hired help (1–2 workers)","a small hired team (3–5 workers)","a larger hired team (6+ workers)"],I3={local:"a local walk-in market (walking distance)",town:"a nearby town market (needs transport)",established:"buyers/contracts you already have lined up"},W3=()=>{const[b,M]=V.useState(8e4),[$,X]=V.useState(2),[O,_]=V.useState(2),[H,T]=V.useState(1),[q,ee]=V.useState("town"),[J,D]=V.useState("3months"),[p,z]=V.useState(""),[te,Ee]=V.useState("mid"),[ce,be]=V.useState(!0),[le,fe]=V.useState("all"),[Re,Te]=V.useState(10),[qe,ot]=V.useState({}),ke=j=>{j&&j.preventDefault(),be(!0),Te(10)},Qe={landDesc:_f[$]?_f[$].charAt(0).toUpperCase()+_f[$].slice(1):"",waterDesc:K3[O]||"",labourDesc:Z3[H]||"",marketDesc:I3[q]||"",climate:te},Z=ON.map(j=>{const de=b>=j.minCapital&&$>=j.landMin&&O>=j.waterMin&&H>=j.labourMin;let U=0;J==="30days"&&j.fastCycle&&(U+=50),J==="3months"&&j.paybackMax<=3&&(U+=25),J==="6months"&&j.paybackMax<=6&&(U+=10),U+=Math.max(0,10-($-j.landMin)*3),U+=Math.max(0,6-(O-j.waterMin)*3),j.risk==="Low"?U+=12:j.risk==="Medium"&&(U+=6);const w=b>0?j.minCapital/b:1;w>=.3&&w<=.9?U+=15:w<.3&&(U+=5);const pe=Math.max(0,j.minCapital-b);return{ent:j,feasible:de,score:U,capitalGap:pe,ctx:Qe}}),Xe=Z.filter(j=>j.feasible).sort((j,de)=>de.score-j.score),ie=Xe.length?Xe[0].ent.id:null,xe=[...Z].sort((j,de)=>j.feasible!==de.feasible?j.feasible?-1:1:j.feasible?de.score-j.score:j.capitalGap-de.capitalGap),Je=le==="all"?xe:xe.filter(j=>j.ent.category===le),nt=Je.slice(0,Re),L=(j,de  scratch, then combined into a 30–45 day compost protocol instead of the usual 2–6 months.",content:[{heading:"Why This System",body:["A compost heap left to break down on its own works, but slowly and unevenly, and finishes carbon-heavy with relatively little available nitrogen, phosphorus, or potassium.","JMS (JADAM Microbial Solution) captures local indigenous microbes and drives fast, even decomposition. This process is adapted from JADAM, a method developed by Youngsang Cho, for local Kenyan conditions.","FAA (Fish Amino Acid) supplies nitrogen and amino-acid nutrition once the pile has cooled.","LAB (Lactic Acid Bacteria) Serum stabilises the microbial population and suppresses pathogens through curing."]},{heading:"Making JMS (100-Litre Batch)",body:["You will need: a plastic container with lid, 2 cotton bags (or clean socks), 2 rocks as weights, a stick, string.","Starter: leaf mold, 100g. Medium: boiled potato, 200g + non-iodised sea salt, 100g.","Getting your leaf mold starter: collect the soft, partly-decomposed soil layer found just under leaf litter near forest or hillside ground — not the top, undecomposed leaves. No forest nearby? Cover bare soil with cut wild grass, keep it moist, and check back in about 3 weeks — the soil underneath will have turned soft and dark. That is your home-made leaf mold.","1. Boil and mash the potato, then knead it inside a cotton bag underwater until it dissolves into the container water. (Using grain instead of potato: cook first, blend with a little water, then knead the same way.)","2. Dissolve the sea salt directly into the container water.","3. Place the leaf mold into its own cotton bag, tie it, weigh it down with a rock, and submerge it fully.","4. Do the same with the potato medium in a separate bag.","5. Cover the container loosely — not airtight. JMS needs airflow.","6. Culture in full sun where possible, at the same conditions as the crop it will feed. Takes roughly 1–3 days total — faster and with more foam in warm weather. Below 18°C, use gentle heating to hold it around 20°C (if using cold underground water, let it stand a day to warm first).","Optional — crop-tuned JMS: add roughly 200g of the target crop’s own trimmings or waste (blended fine, in its own bag) alongside the potato medium — tomato scraps for tomato JMS, pepper trimmings for pepper JMS, and so on."]},{heading:"Knowing When JMS Is Ready — and the Point of No Return",body:["Watch the surface, not the clock — timing varies with temperature, but the foam tells you exactly where the batch is.","Ready to use: when the foam is at its most vigorous and the edges of the foam disc look clean and clearly defined, it is ready — use it now.","CAUTION — the point of no return: if you wait even one day past that peak, the edges of the disc will start to crumble and the microbes inside will die. At that point it is no longer usable as JMS. Don’t throw it away — use it as JLF instead, since the nutrient content is still there even though the living microbial culture is gone."]},{heading:"Applying JMS",body:["Filter the finished liquid through a fine cloth or net before applying — don’t let solids go onto soil or through a hose directly.","General soil use: dilute 10 times with water, and use up the diluted mixture completely in one go — it doesn’t store well once diluted. A 100L batch, diluted, covers roughly 0.02 to 0.66 hectares depending on dilution strength and application method.","Foliar (leaf spray) use: dilute more heavily — over 20 times — and mix in a wetting agent so it spreads and sticks to leaves properly (roughly 0.6L of wetting agent per 100L of original JMS batch used, scaled from the standard 3L per 500L ratio).","If applying through a hose, filter through a fine net first, and run clean water through the hose afterward to prevent clogging."]},{heading:"Making LAB Serum",body:["Ingredients: rice-wash water (second wash), 1 litre. Fresh whole milk (not UHT), 10 litres. Raw molasses, equal to the serum volume collected.","1. Wash 1kg raw rice in 1L clean water. Keep only the second wash (milky-white, starch-rich) — discard the first.","2. Pour the rice-wash water into a jar, cover with cloth, leave at room temperature. Airborne LAB colonises the liquid over 3 days — a mild, sour, yoghurt-like smell is correct.","3. Add 10 parts fresh whole milk to 1 part rice-wash liquid (10:1 ratio). Stir well, cover loosely.","4. Leave undisturbed for 5 days. Curds form on top, serum settles below — do not disturb during separation.","5. Strain the golden-yellow serum away from the white curds using muslin cloth or a fine strainer.","6. Mix the serum 1:1 by volume with raw molasses. Bottle in sealed glass or HDPE containers.","Yield: approximately 3–5 litres of serum from 10 litres of milk.","Shelf life: 12 months sealed at room temperature, up to 24 months refrigerated. Once opened, use within 90 days.","Quality check: golden-yellow colour, mild sour smell. Discard if grey or putrid."]},{heading:"Making FAA (Fish Amino Acid)",body:["Ingredients: fresh fish waste (heads, guts, bones — not salted), 1kg. Raw molasses, 1kg (1:1 by weight).","1. Chop fish waste into pieces no larger than 5cm — smaller pieces ferment faster.","2. Layer fish waste and molasses alternately in a non-metallic container (clay pot or HDPE bucket), finishing with a molasses layer on top.","3. Seal with cloth or a loose lid so gas can escape. Place somewhere warm, ideally 25–30°C.","4. Stir every 3 days with a wooden stick. Active bubbling in week one is correct fermentation. Continue for 21 days total.","5. Strain through muslin or fine mesh — solids can go straight into compost.","6. Bottle in sealed HDPE containers, label with the batch date.","Shelf life: 12 months sealed at room temperature, up to 18 months refrigerated. Once opened, use within 60 days.","Quality check: dark brown liquid, strong fishy/amino smell — slight ammonia is normal. Discard if slimy or visibly mouldy.","CAUTION: keep away from open flames during active fermentation (gas production)."]},{heading:"Building the Compost Heap — Day 0",body:["Materials: fresh manure and/or compostable plant residue; dry carbon material (maize stalks, straw, dry leaf litter, roughly 25–30:1 carbon-to-nitrogen ratio); JMS, FAA and LAB as made above; charged charcoal dust; wood ash and bone char or rock phosphate (optional); water; a tarp or banana-leaf cover.","1. Lay a base layer of dry carbon material about 15–20cm thick, to allow airflow underneath the pile.","2. Add a layer of manure or fresh residue roughly 15–20cm thick.","3. Mix JMS through this layer as you build — do not just pour it on top.","4. Repeat the carbon/manure/JMS layering until the heap reaches roughly 1–1.2m high.","5. Check moisture with a squeeze test: a handful should release only a few drops of water, not a stream.","6. Cover with a tarp or banana leaves, leaving the base open for airflow."]},{heading:"Hot & Nutrient Boost Phases (Days 1–21)",body:["Days 1–14 (Hot Phase): Monitor pile temperature — it should climb toward 50–65°C within the first few days. Turn the pile once around day 5–7 if you notice compaction or odour. Do NOT add FAA or LAB serum yet while the pile is hot — temperatures above ~43°C will kill these inoculants.","Week 2–3 (Nutrient Boost Phase): Once the pile has cooled below 43°C, apply diluted FAA evenly while turning it. Mix in charged biochar, wood ash, and bone char/rock phosphate. Apply diluted LAB serum across the pile to stabilise the microbial population.","Week 3–6 (Curing Phase): Turn every 5–7 days to maintain aeration. Apply a light follow-up dose of LAB serum every 10–14 days. The pile is finished when it no longer reheats after turning, smells earthy, and original materials are no longer identifiable.","Protocol Timeline: JMS + FAA + LAB bio-inoculant protocol takes 30–45 days compared to 4–6 months for unturned heaps."]}]},{id:"jlf-manual",price:0,title:"Symbio JADAM Liquid Fertilizer (JLF)",subtitle:"Crop-specific liquid fertilizer from local weeds and crop waste",teaser:"Turn weeds and crop trimmings into potent, crop-matched liquid fertilizer using rainwater and leaf mold — full ratios for kale, tomato, spinach, and managu.",content:[{heading:"The Foundation",body:["JLF relies on three core components: rainwater (chlorine-free, so it won’t kill beneficial microbes), leaf mold from undisturbed forest soil (the source of indigenous microorganisms), and high-nutrient plant matter such as Tithonia or Lantana plus crop-specific trimmings."]},{heading:"Crop-Specific Ratios",body:["Kale (sukuma wiki): kale trimmings, stems and yellowing leaves + Tithonia diversifolia (nitrogen specialist). Ratio 1:2, plant to water — fill the drum half with plant material.","Tomatoes: pruned suckers, old vines, damaged fruit + Lantana camara (potassium specialist). Ratio 1:2.","Spinach: old leaves and root crowns + Tithonia diversifolia. Ratio 1:2.","Managu (nightshade): older stalks and leaves + Tithonia + Lantana mix. Ratio 1:2."]},{heading:"Step-by-Step Production & Application",body:["1. Collection: gather succulent young Tithonia and Lantana before they go to seed.","2. Preparation: chop plant matter into 2–3 inch pieces.","3. Loading & Inoculation: place into drum, add 500g to 1kg of fresh leaf mold per 100L of rainwater.","4. Sealing: close the lid tightly. JLF is anaerobic — total darkness and lack of air help stabilise nutrients. Let sit for at least 2 months.","Standard soil drench: 1L of JLF into 20–30L of water. Foliar application: 1L of JLF into 50–100L of water (filter finely)."]}]},{id:"living-floor",price:1e3,codeHash:"f25ad04ef93efb9d34be2a9e576fc227f1e32e53db139fe46763bf5c33b741bd",title:"Symbio Living Floor System",subtitle:"A practical protocol for high-yield soil regeneration",teaser:"Layer organic material on undug soil and let microbes, fungi, and earthworms do the work — a 5-step no-till protocol that cuts watering by up to 70% and eliminates weeding.",content:[{heading:"Core Philosophy",body:["Traditional farming treats soil like a container that needs stirring. The Living Floor System treats soil like a living stomach: you do not dig it, you feed it. By layering organic material on the surface, biology — microbes, fungi, and earthworms — does the heavy lifting."]},{heading:"5-Step Protocol",body:["Step 1 — The Neck-Cut: slash weeds at ground level without uprooting, spray with diluted LAB serum (1:20).","Step 2 — The Carbon Carpet: spread a 3-inch layer of dry tree leaves over slashed weeds for fungal dominance.","Step 3 — The Digested Layer: add cow-chewed leftovers, manure, and chopped green Tithonia.","Step 4 — The Banana Shield: split banana stems flat side down across the bed to lock in moisture and supply potassium.","Step 5 — The Quiet Phase: let ferment for 4–8 weeks until rich white mycelium networks form beneath."]},{heading:"Planting & Benefits",body:["Air-Opening: push a garden fork into mulch every 12 inches and wiggle slightly without turning soil.","Seed Drop: pull back mulch circle, drop seed (e.g. maize + velvet bean), and pull mulch around base.","Key Benefits: 70% less irrigation required, near-zero weeding, permanent compounding biological fertility."]}]},{id:"pest-control",price:0,title:"Symbio Biological Pest Control Manual",subtitle:"Companion planting with flowers and herbs to repel pests and attract beneficial insects",teaser:"Marigold, lavender, basil, borage, dill, coriander — a working roster of plants that build a standing defence instead of spraying after pests arrive.",content:[{heading:"The Standing Defense Concept",body:["Rather than spraying chemical pesticides after outbreaks occur, this system uses strategic herbs and insectary flowers to repel pests, mask target plant aromas, and attract parasitoids and predators."]},{heading:"The Floral Arsenal",body:["Dill (Dukat variety): yellow umbels attract parasitic wasps and hoverflies which feed on aphids and caterpillars.","Sunflowers (Dwarf): sentinel plants with extra-floral nectaries that keep ladybugs patrolling the plot.","Coriander: let 10% flower to create a magnet for syrphid fly larvae (each eating hundreds of aphids daily).","Basil (Purple/Genovese): potent scent-masking herb to confuse whiteflies around tomatoes and capsicums.","Marigold & Lavender: strong root and foliage repellent against nematodes, thrips, and aphids.","Borage: instant-refill nectar powerhouse for bees and native pollinators."]},{heading:"The Island Layout Method",body:["Perimeter Shields: plant dill and sunflowers along edges as windbreaks and pest interceptors.","Internal Bio-Hubs: insert a small companion cluster every 15–20 rows.","Bed-Head Guardians: plant marigold and lavender at every entry point to intercept pests early."]}]},{id:"imo-trapping",price:1e3,codeHash:"13279918e5b5cd8aba15b19fb24daf5d80f26abc6a0824448bbfb14d9d016b3c",title:"Symbio IMO Trapping & Multiplication Guide",subtitle:"Capturing, stabilising, multiplying and acclimating indigenous microorganisms — the four-phase method",teaser:"A complete system for capturing wild local microbes and multiplying them into farm-ready volumes — from a box of rice to enough finished inoculant for your whole plot.",content:[{heading:"The Four-Phase System",body:["Indigenous microorganisms (IMO) from local undisturbed forest soils restore soil microbiomes and crowd out pathogens.","Phase 1 (IMO-1): Capture wild microbes in hard-cooked white rice buried under forest leaf litter for 3–7 days.","Phase 2 (IMO-2): Stabilize with equal weight brown sugar/jaggery for 7 days in a cool jar (stores for 12 months).","Phase 3 (IMO-3): Multiply into bulk using maize bran (20–23kg) moistened to 65% with diluted IMO-2 and turned below 50°C for 5–7 days.","Phase 4 (IMO-4): Acclimate by blending 50/50 with target farm soil for 5–7 days before field broadcasting."]},{heading:"Field Application Rates",body:["Dry Soil Inoculation: broadcast a handful per m² 2–3 hours before sunset, mulching immediately.","Liquid Inoculant: massage IMO-4 through cloth into unchlorinated water (1:20) for root drenching or foliar spray."]}]},{id:"regen-microfarm",price:1e3,codeHash:"50f8131009b23f01f2461587aef61d83ace89d3a85b8205310134d7df87b3266",title:"Symbio Regenerative Micro-Farm Operations Guide",subtitle:"Integrating apiary, rabbits, and rotational beds under shade netting",teaser:"A working system combining bees, rabbits, and a rotating vegetable bed layout — sized around a 300m² net with 10 hives as a working example.",content:[{heading:"Integrated Micro-Farm Blueprint",body:["Designed around a 300m² shade net structure with 36 beds (1m x 5m) divided into 6 rotation blocks + 10 beehives + 10 breeding does/2 bucks.","Rotational Bed Cycle: 1 block always rests under nitrogen-fixing green manure (velvet bean/alfalfa) for 4 months before rotating into heavy feeder vegetables (tomatoes/kales).","Rabbit Fertilizer Engine: collect rabbit urine, dilute 1:5 with water, and supply 20L daily as potent liquid fertigation.","Floral Perimeter: perimeter sunflowers and borage feed bees continuously, while internal marigolds protect tomato beds."]}]},{id:"piglet-breeding-guide",price:1e3,codeHash:"0091ce2bb081c04b69e1466e7f315a76f1a80f372c35f258f35d3d234a14462b",title:"Symbio Piglet Breeding Setup Guide",subtitle:"Starting a piglet production enterprise with in-pig sows",teaser:"Starting with pregnant sows skips the longest part of the wait — housing design, feed formulation, and the one structural detail that prevents most piglet deaths.",content:[{heading:"Fast-Track Breeding Strategy",body:["Starting with 50–60kg F1 crossbred sows (Large White x Landrace) already in-pig yields weaner sales in month 8 rather than waiting over 14 months.","Creep Rails: install low horizontal barrier rails along farrowing pen walls — this single structural feature prevents 90% of crushing fatalities.","Balanced Low-Cost Ration: mix maize bran and cassava peelings with high-protein omena (fish meal) or fermented lucerne.","Annual Target: 2 farrowing cycles per sow per year yielding 15–20 weaned piglets annually per sow under good management."]}]},{id:"pig-refinery-system",price:2500,codeHash:"90c0e39a9d8187db3bca6e495c4b4527df5d3c5ba36a0c32061d5d70b229da47",title:"Symbio Pig Refinery System",subtitle:"Deep litter housing and submerged fermentation feed for low-odour, high-efficiency pig keeping",teaser:"Housing that never needs washing, and a feed method that pre-digests forage before the pig eats it — tackling smell, feed cost, and growth rate together.",content:[{heading:"The Deep Litter Housing & Submerged Fermentation Protocol",body:["Deep Litter: 2-foot sawdust/rice husk pit periodically sprayed with LAB serum. Microbes continuously break down dung with zero daily washing, zero runoff, and zero odor.","Submerged Fermentation (70/30 Model): chop fresh lucerne/desmodium, mix with bran, pack in 50kg sacks, and submerge in a 200L drum of rainwater, molasses, and LAB serum.","Pre-Digested Feed: after 3–5 days, feed is pre-digested, nutrient-dense, and highly palatable, reducing expensive commercial concentrate demand by up to 70%."]}]},{id:"onfarm-solutions",price:2500,codeHash:"f379b4459bb0051d90f88487fb9d0c3abe029517c25b8f3019f0ee18f8b620ee",title:"Symbio On-Farm Biological Solutions",subtitle:"Fish Amino Acid, Living Weed Extract, and the Power Blend — turning farm waste into a complete fertility system",teaser:"An enhanced FAA formula, a brand-new living weed extract (Bioverde), and how to combine both with LAB serum into one Power Blend with a full-season application schedule.",content:[{heading:"Complete On-Farm Fertility Roster",body:["Enhanced FAA: fish waste + molasses + mashed ripe bananas + LAB serum fermented for 21 days (foliar) or 90 days (deep soil restorative).","Bioverde (Living Weed Extract): young diverse weeds (dandelion, dock, amaranth) + forest leaf mold + LAB serum fermented anaerobically to extract natural auxins and cytokinins.",
