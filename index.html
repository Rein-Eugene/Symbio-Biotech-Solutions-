<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Weather Dashboard</h1>

    <form id="searchForm" class="search">
      <input id="q" type="search" placeholder="Search city (e.g. London)" aria-label="City" />
      <button type="submit">Search</button>
      <button id="locBtn" type="button" title="Use my location">📍 My location</button>
      <label class="toggle">
        <input id="unitToggle" type="checkbox" />
        <span>°F</span>
      </label>
    </form>

    <div id="message" class="message" hidden></div>

    <section id="current" class="card hidden" aria-live="polite">
      <div class="current-left">
        <div id="icon" class="icon">☀️</div>
        <div>
          <h2 id="place">—</h2>
          <p id="desc">—</p>
        </div>
      </div>
      <div class="current-right">
        <div class="temp">
          <span id="temp">--</span><span class="unit">°C</span>
        </div>
        <div class="meta">
          <div>Wind: <span id="wind">--</span> m/s</div>
          <div id="updated">Updated: --</div>
        </div>
      </div>
    </section>

    <section id="forecast" class="grid hidden" aria-live="polite"></section>

    <footer class="footer">
      Data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open‑Meteo</a>. No API key required.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
